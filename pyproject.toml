[project]
name = "ai-transcriber"
version = "0.2.0"
description = "HTTP speech-to-text service built on faster-whisper, with an OpenAI-compatible API"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Eduardo Correia", email = "ecorreia@apliant.com.br" }]

[project.urls]
Homepage = "https://github.com/99ecarvalho/ai-transcriber"
Issues = "https://github.com/99ecarvalho/ai-transcriber/issues"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI's File()/Form() defaults are the intended pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # import the package from the checkout, also with plain `pytest`
